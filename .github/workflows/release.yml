name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check tag matches manifest.json, package.json and versions.json
        run: |
          tag="${GITHUB_REF_NAME}"
          m="$(node -p "require('./manifest.json').version")"
          p="$(node -p "require('./package.json').version")"
          v="$(node -p "require('./versions.json')['${tag}'] || ''")"
          [ "$m" = "$tag" ] || { echo "manifest.json version $m != tag $tag"; exit 1; }
          [ "$p" = "$tag" ] || { echo "package.json version $p != tag $tag"; exit 1; }
          [ -n "$v" ] || { echo "versions.json has no entry for $tag"; exit 1; }
          min="$(node -p "require('./manifest.json').minAppVersion")"
          [ "$v" = "$min" ] || { echo "versions.json maps $tag to $v but manifest minAppVersion is $min"; exit 1; }
      - name: Typecheck
        run: npx tsc -noEmit -skipLibCheck
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" --generate-notes
